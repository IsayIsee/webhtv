name: Sync upstream

on:
  schedule:
    - cron: '10 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/fish2018/webhtv.git
          git fetch upstream main

      - name: Fast-forward main to upstream
        run: |
          git merge --ff-only upstream/main
          git push origin main

  merge-into-dev:
    needs: sync-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: my_dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest main
        run: git fetch origin main

      - name: Try merge main into my_dev
        id: merge
        run: |
          set +e
          git merge origin/main --no-edit
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Push if merge succeeded
        if: steps.merge.outputs.status == '0'
        run: git push origin my_dev

      - name: Abort merge on conflict
        if: steps.merge.outputs.status != '0'
        run: git merge --abort

      - name: Notify webhook on conflict
        if: steps.merge.outputs.status != '0'
        run: |
          curl -sS -X POST "${{ secrets.MERGE_FAIL_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"⚠️ 自动合并冲突: main -> my_dev\n仓库: ${{ github.repository }}\n时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)\n请手动处理: https://github.com/${{ github.repository }}/compare/my_dev...main\"
            }"